name: commitlint

on:
  # The release PR touches only these two files and is opened by
  # github-actions[bot], whose runs wait for approval; it merges at once, so
  # those runs would only expire and show red.
  pull_request:
    types: [opened, edited, synchronize, reopened]
    paths-ignore:
      - CHANGELOG.md
      - .release-please-manifest.json
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  commitlint:
    name: Conventional Commits lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # commitlint walks the PR's commit range; needs full history.
          fetch-depth: 0
          persist-credentials: false
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed  # v6.2.1
        with:
          configFile: commitlint.config.cjs
      # A squash merge takes the PR title, followed by " (#N)", as the subject
      # of the commit on main, so the title is linted too, before the merge: as
      # written, then as that subject for its length. Both use the repo's config
      # with commitlint's default ignores ("Revert ...", "fixup! ...") off, so
      # no title is skipped. An edit of the title reruns this job (the `edited`
      # type).
      - name: Lint the PR title
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          dir="$RUNNER_TEMP/commitlint"
          npm install --prefix "$dir" --no-save --no-package-lock --no-audit --no-fund \
            @commitlint/cli@19.8.1 @commitlint/config-conventional@19.8.1
          cp commitlint.config.cjs "$dir/"
          cd "$dir"
          echo "module.exports = { ...require('./commitlint.config.cjs'), defaultIgnores: false };" > title.config.cjs
          printf '%s\n' "$TITLE" | ./node_modules/.bin/commitlint --config title.config.cjs
          printf '%s (#%s)\n' "$TITLE" "$NUMBER" | ./node_modules/.bin/commitlint --config title.config.cjs
